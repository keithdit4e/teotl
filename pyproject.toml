[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teotl"
version = "0.1.0"
description = "Production-ready autonomous agent framework with 40% cost savings via planner-worker architecture."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Teotl Contributors" },
]
maintainers = [
    { name = "Teotl Contributors" },
]
keywords = [
    "ai", "agent", "llm", "autonomous", "framework",
    "guardrails", "memory", "planner-worker", "cost-optimization",
    "production", "claude", "openai", "anthropic"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "ulid-py>=1.1",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
ollama = ["ollama>=0.4"]
litellm = ["litellm>=1.50"]
memory = [
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
]
security = [
    "cryptography>=43.0",
    "keyring>=25.0",
]
web = [
    "aiohttp>=3.9",
]
all = [
    "teotl[anthropic,openai,ollama,litellm,memory,security,web]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
teotl = "teotl.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/teotl"
Documentation = "https://github.com/yourusername/teotl/blob/main/docs"
Repository = "https://github.com/yourusername/teotl"
Issues = "https://github.com/yourusername/teotl/issues"
Changelog = "https://github.com/yourusername/teotl/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["teotl"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
