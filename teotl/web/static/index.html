<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Multi-Agent Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .agent-count {
            font-size: 16px;
            opacity: 0.9;
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Agent Pills */
        .agent-selector {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .agent-selector-header {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .agent-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .agent-pill {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #475569;
            background: #0f172a;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
        }

        .agent-pill.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .agent-pill:hover {
            border-color: #667eea;
        }

        .agent-pill.all {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        /* Agent Comparison Grid */
        .agent-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .agent-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .agent-card-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #f1f5f9;
        }

        .agent-card-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .agent-stat {
            text-align: center;
        }

        .agent-stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .agent-stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Aggregate Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }

        .section {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            color: #f1f5f9;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }

        .task-list, .mission-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-item, .mission-item {
            background: #0f172a;
            padding: 18px;
            border-radius: 8px;
            border-left: 4px solid #475569;
            transition: transform 0.2s, border-color 0.2s;
        }

        .task-item:hover, .mission-item:hover {
            transform: translateX(4px);
            border-color: #667eea;
        }

        .task-item.completed {
            border-color: #10b981;
        }

        .task-item.failed {
            border-color: #ef4444;
        }

        .task-item.pending {
            border-color: #f59e0b;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
            gap: 12px;
        }

        .item-description {
            font-size: 16px;
            font-weight: 500;
            color: #f1f5f9;
            flex: 1;
        }

        .item-badges {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .item-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .badge-agent {
            background: #3b82f6;
            color: white;
        }

        .badge-completed {
            background: #10b981;
            color: white;
        }

        .badge-pending {
            background: #f59e0b;
            color: white;
        }

        .badge-failed {
            background: #ef4444;
            color: white;
        }

        .badge-high {
            background: #f59e0b;
            color: white;
        }

        .badge-normal {
            background: #3b82f6;
            color: white;
        }

        .badge-critical {
            background: #dc2626;
            color: white;
        }

        .item-meta {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 8px;
        }

        .item-result {
            margin-top: 12px;
            padding: 12px;
            background: #0f172a;
            border-radius: 6px;
            font-size: 14px;
            color: #cbd5e1;
            border: 1px solid #334155;
            max-height: 200px;
            overflow-y: auto;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .hidden {
            display: none;
        }

        /* Mission Details */
        .mission-details {
            margin-top: 15px;
            padding: 15px;
            background: #1e293b;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .mission-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .mission-stat {
            text-align: center;
        }

        .mission-stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        .mission-stat-value.success {
            color: #10b981;
        }

        .mission-stat-value.failure {
            color: #ef4444;
        }

        .mission-stat-value.neutral {
            color: #667eea;
        }

        .mission-stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Execution History Timeline */
        .execution-timeline {
            margin-top: 15px;
        }

        .timeline-header {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 10px;
        }

        .timeline-item {
            display: flex;
            gap: 12px;
            padding: 10px;
            margin-bottom: 8px;
            background: #0f172a;
            border-radius: 6px;
            border-left: 3px solid #475569;
        }

        .timeline-item.success {
            border-left-color: #10b981;
        }

        .timeline-item.failure {
            border-left-color: #ef4444;
        }

        .timeline-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-time {
            font-size: 12px;
            color: #94a3b8;
        }

        .timeline-summary {
            font-size: 14px;
            color: #e2e8f0;
            margin-top: 4px;
        }

        .timeline-error {
            font-size: 13px;
            color: #fca5a5;
            margin-top: 4px;
            font-family: 'Courier New', monospace;
        }

        /* Progress Items */
        .progress-section {
            margin-top: 15px;
        }

        .progress-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .progress-item {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            background: #0f172a;
            border: 1px solid #334155;
        }

        .progress-item.completed {
            background: #064e3b;
            border-color: #10b981;
            color: #10b981;
        }

        .progress-item.skipped {
            background: #7c2d12;
            border-color: #f59e0b;
            color: #fbbf24;
        }

        /* Success Rate Bar */
        .success-rate-bar {
            margin-top: 10px;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }

        .success-rate-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            transition: width 0.3s;
        }

        .success-rate-label {
            margin-top: 4px;
            font-size: 12px;
            color: #94a3b8;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Forge Multi-Agent Dashboard</h1>
            <div class="header-info">
                <div class="agent-count" id="agent-count">Monitoring 0 agents</div>
                <div class="connection-status">
                    <span class="status-dot" id="ws-status"></span>
                    <span id="ws-text">Connected</span>
                </div>
            </div>
        </header>

        <!-- Agent Selector -->
        <div class="agent-selector">
            <div class="agent-selector-header">Filter by Agent</div>
            <div class="agent-pills" id="agent-pills">
                <div class="agent-pill all active" onclick="filterAgents(null)">
                    All Agents
                </div>
                <!-- Agent pills will be added dynamically -->
            </div>
        </div>

        <!-- Per-Agent Stats Grid -->
        <div class="agent-grid" id="agent-grid">
            <!-- Agent cards will be added dynamically -->
        </div>

        <!-- Aggregate Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Total Agents</div>
                <div class="stat-value" id="total-agents">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pending Tasks</div>
                <div class="stat-value" id="pending-count">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed Tasks</div>
                <div class="stat-value" id="completed-count">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Missions</div>
                <div class="stat-value" id="missions-count">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Mission Executions</div>
                <div class="stat-value" id="executions-count">-</div>
            </div>
        </div>

        <!-- Recent Tasks -->
        <div class="section">
            <div class="section-header">
                <h2>📋 Recent Tasks</h2>
                <button class="refresh-btn" onclick="loadTasks()">Refresh</button>
            </div>
            <div id="tasks-container" class="task-list">
                <div class="loading">Loading tasks...</div>
            </div>
        </div>

        <!-- Missions -->
        <div class="section">
            <div class="section-header">
                <h2>🎯 Missions</h2>
                <button class="refresh-btn" onclick="loadMissions()">Refresh</button>
            </div>
            <div id="missions-container" class="mission-list">
                <div class="loading">Loading missions...</div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentAgentFilter = null;
        let allAgents = [];

        // Connect WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('ws-status').classList.remove('disconnected');
                document.getElementById('ws-text').textContent = 'Connected';
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('ws-status').classList.add('disconnected');
                document.getElementById('ws-text').textContent = 'Disconnected';
                setTimeout(connectWebSocket, 3000);
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                console.log('WebSocket message:', message);

                if (message.type === 'status') {
                    updateStatus(message.data);
                } else if (message.type === 'task_completed' || message.type === 'mission_executed') {
                    loadAll();
                }
            };
        }

        // Filter agents
        function filterAgents(agentId) {
            currentAgentFilter = agentId;

            // Update pill states
            document.querySelectorAll('.agent-pill').forEach(pill => {
                pill.classList.remove('active');
            });

            if (agentId === null) {
                document.querySelector('.agent-pill.all').classList.add('active');
            } else {
                document.querySelector(`.agent-pill[data-agent="${agentId}"]`)?.classList.add('active');
            }

            // Reload data with filter
            loadTasks();
            loadMissions();
        }

        // Load agents info
        async function loadAgents() {
            try {
                const response = await fetch('/api/agents');
                const agents = await response.json();
                allAgents = agents;

                // Update agent pills
                const pillsContainer = document.getElementById('agent-pills');
                const existingPills = pillsContainer.querySelectorAll('.agent-pill:not(.all)');
                existingPills.forEach(p => p.remove());

                agents.forEach(agent => {
                    const pill = document.createElement('div');
                    pill.className = 'agent-pill';
                    pill.dataset.agent = agent.agent_id;
                    pill.textContent = agent.agent_id;
                    pill.onclick = () => filterAgents(agent.agent_id);
                    pillsContainer.appendChild(pill);
                });

                // Update agent grid
                const gridContainer = document.getElementById('agent-grid');
                gridContainer.innerHTML = agents.map(agent => `
                    <div class="agent-card">
                        <div class="agent-card-header">🤖 ${escapeHtml(agent.agent_id)}</div>
                        <div class="agent-card-stats">
                            <div class="agent-stat">
                                <div class="agent-stat-value">${agent.tasks.pending}</div>
                                <div class="agent-stat-label">Pending</div>
                            </div>
                            <div class="agent-stat">
                                <div class="agent-stat-value">${agent.tasks.completed}</div>
                                <div class="agent-stat-label">Completed</div>
                            </div>
                            <div class="agent-stat">
                                <div class="agent-stat-value">${agent.missions.total}</div>
                                <div class="agent-stat-label">Missions</div>
                            </div>
                            <div class="agent-stat">
                                <div class="agent-stat-value">${agent.missions.executions}</div>
                                <div class="agent-stat-label">Executions</div>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Update header
                document.getElementById('agent-count').textContent = `Monitoring ${agents.length} agent${agents.length !== 1 ? 's' : ''}`;

            } catch (error) {
                console.error('Failed to load agents:', error);
            }
        }

        // Load status
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                updateStatus(data);
            } catch (error) {
                console.error('Failed to load status:', error);
            }
        }

        // Update status display
        function updateStatus(data) {
            document.getElementById('total-agents').textContent = data.agent_count;
            document.getElementById('pending-count').textContent = data.tasks.pending;
            document.getElementById('completed-count').textContent = data.tasks.completed;
            document.getElementById('missions-count').textContent = data.missions.total;
            document.getElementById('executions-count').textContent = data.missions.total_executions;
        }

        // Load tasks
        async function loadTasks() {
            try {
                let url = '/api/tasks?limit=30';
                if (currentAgentFilter) {
                    url += `&agents=${currentAgentFilter}`;
                }

                const response = await fetch(url);
                const tasks = await response.json();

                const container = document.getElementById('tasks-container');

                if (tasks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div>No tasks${currentAgentFilter ? ' for this agent' : ''}</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = tasks.map(task => `
                    <div class="task-item ${task.state}">
                        <div class="item-header">
                            <div class="item-description">${escapeHtml(task.description)}</div>
                            <div class="item-badges">
                                <span class="item-badge badge-agent">${escapeHtml(task.agent_id)}</span>
                                <span class="item-badge badge-${task.state}">${task.state}</span>
                                <span class="item-badge badge-${task.priority.toLowerCase()}">${task.priority}</span>
                            </div>
                        </div>
                        <div class="item-meta">
                            Created: ${formatDate(task.created_at)}
                            ${task.completed_at ? ` • Completed: ${formatDate(task.completed_at)}` : ''}
                        </div>
                        ${task.result ? `
                            <div class="item-result">
                                <strong>Result:</strong><br>
                                ${escapeHtml(JSON.stringify(task.result, null, 2))}
                            </div>
                        ` : ''}
                        ${task.error ? `
                            <div class="item-result" style="border-color: #ef4444;">
                                <strong>Error:</strong><br>
                                ${escapeHtml(task.error)}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load tasks:', error);
            }
        }

        // Load missions
        async function loadMissions() {
            try {
                let url = '/api/missions';
                if (currentAgentFilter) {
                    url += `?agents=${currentAgentFilter}`;
                }

                const response = await fetch(url);
                const missions = await response.json();

                const container = document.getElementById('missions-container');

                if (missions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🎯</div>
                            <div>No missions${currentAgentFilter ? ' for this agent' : ''}</div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = missions.map(mission => `
                    <div class="mission-item">
                        <div class="item-header">
                            <div class="item-description">${escapeHtml(mission.description)}</div>
                            <div class="item-badges">
                                <span class="item-badge badge-agent">${escapeHtml(mission.agent_id)}</span>
                                <span class="item-badge badge-${mission.state}">${mission.state}</span>
                                ${mission.tags ? mission.tags.map(tag => `<span class="item-badge badge-normal">${escapeHtml(tag)}</span>`).join('') : ''}
                            </div>
                        </div>
                        <div class="item-meta">
                            Interval: ${mission.interval} •
                            Executed: ${mission.execution_count} times
                            ${mission.last_execution_at ? ` • Last: ${formatDate(mission.last_execution_at)}` : ''}
                            ${mission.next_execution_at ? ` • Next: ${formatDate(mission.next_execution_at)}` : ''}
                        </div>

                        ${renderMissionDetails(mission)}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load missions:', error);
            }
        }

        // Render mission details
        function renderMissionDetails(mission) {
            if (!mission.execution_history || mission.execution_history.length === 0) {
                return '';
            }

            const history = mission.execution_history;
            const successCount = history.filter(h => h.success).length;
            const failureCount = history.filter(h => !h.success).length;
            const successRate = mission.success_rate || 0;

            return `
                <div class="mission-details">
                    <!-- Stats -->
                    <div class="mission-stats">
                        <div class="mission-stat">
                            <div class="mission-stat-value success">${successCount}</div>
                            <div class="mission-stat-label">Successful</div>
                        </div>
                        <div class="mission-stat">
                            <div class="mission-stat-value failure">${failureCount}</div>
                            <div class="mission-stat-label">Failed</div>
                        </div>
                        <div class="mission-stat">
                            <div class="mission-stat-value neutral">${mission.completed_items ? mission.completed_items.length : 0}</div>
                            <div class="mission-stat-label">Completed</div>
                        </div>
                        <div class="mission-stat">
                            <div class="mission-stat-value neutral">${mission.skipped_items ? mission.skipped_items.length : 0}</div>
                            <div class="mission-stat-label">Skipped</div>
                        </div>
                    </div>

                    <!-- Success Rate -->
                    <div class="success-rate-bar">
                        <div class="success-rate-fill" style="width: ${successRate}%"></div>
                    </div>
                    <div class="success-rate-label">Success Rate: ${successRate}%</div>

                    <!-- Progress Items -->
                    ${(mission.completed_items && mission.completed_items.length > 0) ? `
                        <div class="progress-section">
                            <div class="timeline-header">✅ Completed Improvements</div>
                            <div class="progress-items">
                                ${mission.completed_items.map(item => `
                                    <div class="progress-item completed">${escapeHtml(item)}</div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${(mission.skipped_items && mission.skipped_items.length > 0) ? `
                        <div class="progress-section">
                            <div class="timeline-header">⏭️ Skipped Items</div>
                            <div class="progress-items">
                                ${mission.skipped_items.map(item => `
                                    <div class="progress-item skipped">${escapeHtml(item)}</div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- Execution History Timeline -->
                    <div class="execution-timeline">
                        <div class="timeline-header">📊 Execution History (Last ${Math.min(10, history.length)})</div>
                        ${history.slice(-10).reverse().map(exec => `
                            <div class="timeline-item ${exec.success ? 'success' : 'failure'}">
                                <div class="timeline-icon">${exec.success ? '✅' : '❌'}</div>
                                <div class="timeline-content">
                                    <div class="timeline-time">${formatDate(exec.timestamp)}</div>
                                    ${exec.summary ? `
                                        <div class="timeline-summary">${escapeHtml(exec.summary)}</div>
                                    ` : ''}
                                    ${exec.error ? `
                                        <div class="timeline-error">Error: ${escapeHtml(exec.error)}</div>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    ${mission.roadmap_preview ? `
                        <div class="progress-section">
                            <div class="timeline-header">🗺️ Roadmap Preview</div>
                            <div class="item-result">
                                ${escapeHtml(mission.roadmap_preview)}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Load all data
        function loadAll() {
            loadStatus();
            loadAgents();
            loadTasks();
            loadMissions();
        }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        // Initialize
        connectWebSocket();
        loadAll();

        // Auto-refresh every 30 seconds
        setInterval(loadAll, 30000);
    </script>
</body>
</html>
